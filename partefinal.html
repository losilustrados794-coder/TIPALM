<html>
  <head>
    <link rel="stylesheet" href="css/main.css">
    <title>partefinal</title>
  </head>
  <script>
  (function () {
    var audio = document.getElementById('audio-pagina');
    var btnPausa = document.getElementById('btn-pausa');
    var btnReiniciar = document.getElementById('btn-reiniciar');

    function actualizarBoton() { btnPausa.textContent = audio.paused ? 'Reproducir' : 'Pausar'; }

    // Suena al entrar; si el navegador lo bloquea, suena en el primer clic/toque/tecla
    var p = audio.play();
    if (p && p.catch) {
      p.catch(function () {
        ['click', 'touchstart', 'keydown'].forEach(function (ev) {
          document.addEventListener(ev, function () {
            audio.play().catch(function () {});
          }, { once: true });
        });
      });
    }

    btnPausa.addEventListener('click', function () {
      if (audio.paused) audio.play(); else audio.pause();
    });
    btnReiniciar.addEventListener('click', function () {
      audio.currentTime = 0;
      audio.play();
    });

    audio.addEventListener('play', actualizarBoton);
    audio.addEventListener('pause', actualizarBoton);
    actualizarBoton();
  })();
</script>
  <body>
    <h1>FElICIDADES <span id="nombreUsuario"></span> POR COMPLETAR NUESTRO TEST</h1>
    <br>
    <br>
    <div class="boton-largo">
      <a href="index.html">
        <button type="button" class="mi-boton">volver al principio</button>
      </a>
    </div>
    <script>
    // 1. Capturamos los datos que viajan en la URL
    const parametros = new URLSearchParams(window.location.search);
    
    // 2. Extraemos el valor que tiene 'nombre' (el mismo name del input del formulario)
    const elNombre = parametros.get('nombre');
    
    // 3. Si el usuario escribió un nombre, lo insertamos en el span de la página
    if (elNombre) {
      document.getElementById('nombreUsuario').textContent = elNombre;
    } else {
      document.getElementById('nombreUsuario').textContent = "Astronauta"; // Por si entran sin escribir nada
    }
  </script>
  </body>
</html>
