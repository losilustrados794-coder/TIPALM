<html>
  <head>
    <link rel="stylesheet" href="../css/main.css">
    <title>preg1</title>
  </head>
<body>
  <h1>¿Cómo te sientes antes de dormir?</h1>
  <h1>(sé sincero)</h1>
</br>
  <div class="div-img">
    <button type="button" onclick="window.location.href='../noche/emociones/triste.html'">
     <img src='../img/cara_muy_triste.png'>
      </button>
    <button type="button" onclick="window.location.href='../noche/emociones/enojado.html'">
     <img src='../img/cara_enojada.png'>
      </button>
    <button type="button" onclick="window.location.href='../noche/emociones/neutro.html'">
     <img src='../img/cara_neutral.png'>
      </button>
      <button type="button" onclick="window.location.href='../noche/emociones/feliz.html'">
     <img src='../img/cara_feliz.png'>
      </button>
      <button type="button" onclick="window.location.href='../noche/emociones/superfeliz.html'">
     <img src='../img/cara_superfeliz.png'>
      </button>
  </div>
     <script src="../js/avatar-personaje-completo.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof Personaje !== 'undefined') {
        const miPersonaje = Personaje.crear('#personaje-animado', { 
          ancho: 320 
        });

      miPersonaje.decir('como te sientes?', {
  expresion: 'normal',   // cómo se ve la cara
  pose: 'senalar',           // qué hacen los brazos
  ms: 1800000              // cuánto dura el globo (en milisegundos)
});
      } else {
        console.warn("El script del personaje no se ha cargado correctamente.");
      }
    });
  </script>
</body>
</html>
