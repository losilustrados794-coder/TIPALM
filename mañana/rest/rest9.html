  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof Personaje === 'undefined') {
        console.warn('El script del personaje no se ha cargado correctamente.');
        return;
      }
      var miPersonaje = Personaje.crear('#personaje-animado', { ancho: 320 });
      miPersonaje.expresion('normal');
      miPersonaje.ok(20000000);
      miPersonaje.hablar(2000);
    });
  </script>

    <div class="cuadro-de-texto">

      «Dedicar un momento a escribir lo que sientes es una forma de escucharte y comprenderte. Cada palabra puede ayudarte a encontrar tranquilidad».
