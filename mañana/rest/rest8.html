  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof Personaje === 'undefined') {
        console.warn('El script del personaje no se ha cargado correctamente.');
        return;
      }
      var miPersonaje = Personaje.crear('#personaje-animado', { ancho: 320 });
      miPersonaje.expresion('normal');
      miPersonaje.ok(20000000);
    });
  </script>

      <p>
        «Tómate un momento para organizar tus prioridades. Conocer tus responsabilidades te permitirá avanzar con confianza; no tienes que hacerlo todo a la vez, paso a paso cumplirás cada objetivo de la misión. ¡La claridad también es parte del éxito!»
      </p>
