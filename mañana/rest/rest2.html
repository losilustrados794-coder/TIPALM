  <body>
    <h1>¿Qué hacer si me dan pesadillas?</h1>
    <br>
    <br>
      <div id="personaje-animado"></div>

  <script src="../../js/avatar-personaje-completo.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof Personaje === 'undefined') {
        console.warn('El script del personaje no se ha cargado correctamente.');
        return;
      }
      var miPersonaje = Personaje.crear('#personaje-animado', { ancho: 320 });
      miPersonaje.expresion('normal');
      miPersonaje.ok(20000000);
      miPersonaje.hablar(20000000);
    });
  </script>
    <div class="cuadro-de-texto">
      <p>
      Cambia el desenlace de la pesadilla que recuerda mientras está despierto, para que ya no sea amenazadora. Luego, usted ensaye el nuevo desenlace en su mente. Este enfoque puede reducir la frecuencia de las pesadillas.
      </p>
    </div>
    <div class="boton-largo">
      <a href="../../mañana/preg3.html">
        <button type="button" class="mi-boton">siguiente pregunta</button>
      </a>
    </div>
