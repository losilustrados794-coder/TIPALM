<html>
  <head>
    <link rel="stylesheet" href="../../css/main.css">
    <title>rest2</title>
  </head>
  <script>
  (function () {
    var audio = document.getElementById('audio-pagina');
    var btnPausa = document.getElementById('btn-pausa');
    var btnReiniciar = document.getElementById('btn-reiniciar');

    function actualizarBoton() { btnPausa.textContent = audio.paused ? 'Reproducir' : 'Pausar'; }

    // Suena al entrar; si el navegador lo bloquea, suena en el primer clic/toque/tecla
    var p = audio.play();
    if (p && p.catch) {
      p.catch(function () {
        ['click', 'touchstart', 'keydown'].forEach(function (ev) {
          document.addEventListener(ev, function () {
            audio.play().catch(function () {});
          }, { once: true });
        });
      });
    }

    btnPausa.addEventListener('click', function () {
      if (audio.paused) audio.play(); else audio.pause();
    });
    btnReiniciar.addEventListener('click', function () {
      audio.currentTime = 0;
      audio.play();
    });

    audio.addEventListener('play', actualizarBoton);
    audio.addEventListener('pause', actualizarBoton);
    actualizarBoton();
  })();
        </script>
  <body>
    <h1>¿Qué hacer si me sentía ansioso antes de dormir?</h1>
    <br>
    <br>
    <div class="cuadro-de-texto">
      <p>
       Trabajemos técnicas de relajación y control de la activación, la reestructuración de los pensamientos que alimentan la preocupación por dormir, el control de estímulos (recuperar la cama como lugar de descanso) y una higiene del sueño realista.
      </p>
    </div>
    <div class="boton-largo">
      <a href="../../mañana/preg3.html">
        <button type="button" class="mi-boton">siguiente pregunta</button>
      </a>
    </div>
  <div id="personaje-animado"></div>

  <script src="../../js/avatar-personaje-completo.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof Personaje === 'undefined') {
        console.warn('El script del personaje no se ha cargado correctamente.');
        return;
      }
      var miPersonaje = Personaje.crear('#personaje-animado', { ancho: 320 });
      miPersonaje.expresion('normal');
      miPersonaje.ok(200000000);
      miPersonaje.hablar(20000000);
    });
  </script>
<audio id="audio-pagina" src="../../audio/audio16.m4a" preload="auto"></audio>
<div class="audio-controles">
  <button type="button" id="btn-pausa">Pausar</button>
  <button type="button" id="btn-reiniciar">Reiniciar</button>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var audio = document.getElementById('audio-pagina');
    var btnPausa = document.getElementById('btn-pausa');
    var btnReiniciar = document.getElementById('btn-reiniciar');
    if (!audio || !btnPausa || !btnReiniciar) {
      console.error('Faltan elementos del audio en esta página:', { audio: !!audio, pausa: !!btnPausa, reiniciar: !!btnReiniciar });
      return;
    }

    function actualizarBoton() { btnPausa.textContent = audio.paused ? 'Reproducir' : 'Pausar'; }

    var p = audio.play();
    if (p && p.catch) {
      p.catch(function () {
        ['click', 'touchstart', 'keydown'].forEach(function (ev) {
          document.addEventListener(ev, function () { audio.play().catch(function () {}); }, { once: true });
        });
      });
    }

    btnPausa.addEventListener('click', function () { if (audio.paused) audio.play(); else audio.pause(); });
    btnReiniciar.addEventListener('click', function () { audio.currentTime = 0; audio.play(); });
    audio.addEventListener('play', actualizarBoton);
    audio.addEventListener('pause', actualizarBoton);
    audio.addEventListener('error', function () {
      console.error('AUDIO NO CARGA -> ' + audio.currentSrc + ' | código ' + (audio.error ? audio.error.code : '?'));
    });
    actualizarBoton();
  });
</script>
  </body>
</html>
