<html>
  <head>
    <link rel="stylesheet" href="../../../css/main.css">
    <title>rest5-3</title>
  </head>
  <body>
    <h1>Comparte con tu tripulación</h1>
    <br>
    <br>
    <div class="cuadro-de-texto">
      <p>
       Busca un momento para conversar, compartir una actividad o expresar cómo te sientes
      </p>
    </div>
    <div class="boton-largo">
      <a href="../../../mañana/preg6.html">
        <button type="button" class="mi-boton">siguiente pregunta</button>
      </a>
    </div>
    <div id="personaje-animado"></div>

  <!-- Ruta corregida con ../ para salir de la carpeta mañana -->
  <script src="../../../js/avatar-personaje-completo.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof Personaje !== 'undefined') {
        const miPersonaje = Personaje.crear('#personaje-animado', { 
          ancho: 320 
        });

      miPersonaje.decir('como te sientes?', {
  expresion: 'normal',   // cómo se ve la cara
  pose: 'senalar',           // qué hacen los brazos
  ms: 1800000              // cuánto dura el globo (en milisegundos)
});
      } else {
        console.warn("El script del personaje no se ha cargado correctamente.");
      }
    });
  </script>

  </body>
</html>
