             <div id="personaje-animado"></div>

  <script src="../../js/avatar-personaje-completo.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof Personaje === 'undefined') {
        console.warn('El script del personaje no se ha cargado correctamente.');
        return;
      }
      var miPersonaje = Personaje.crear('#personaje-animado', { ancho: 320 });
      miPersonaje.expresion('normal');
      miPersonaje.ok(2000);
    });
  </script>
    <div class="cuadro-de-texto">
      <p>
       «Compartir lo que sientes también es una muestra de fortaleza. Recuerda que apoyarse entre compañeros hace que ningún desafío se enfrente en soledad».
      </p>
