<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../css/main.css">
  <title>Pregunta 1</title>
</head>
  <script>
  (function () {
    var audio = document.getElementById('audio-pagina');
    var btnPausa = document.getElementById('btn-pausa');
    var btnReiniciar = document.getElementById('btn-reiniciar');

    function actualizarBoton() { btnPausa.textContent = audio.paused ? 'Reproducir' : 'Pausar'; }

    // Suena al entrar; si el navegador lo bloquea, suena en el primer clic/toque/tecla
    var p = audio.play();
    if (p && p.catch) {
      p.catch(function () {
        ['click', 'touchstart', 'keydown'].forEach(function (ev) {
          document.addEventListener(ev, function () {
            audio.play().catch(function () {});
          }, { once: true });
        });
      });
    }

    btnPausa.addEventListener('click', function () {
      if (audio.paused) audio.play(); else audio.pause();
    });
    btnReiniciar.addEventListener('click', function () {
      audio.currentTime = 0;
      audio.play();
    });

    audio.addEventListener('play', actualizarBoton);
    audio.addEventListener('pause', actualizarBoton);
    actualizarBoton();
  })();
      </script>

<body>

  <h1>¿Cómo te sientes en este momento?</h1>
  <h1>(sé sincero)</h1>

  <br>
         <div id="personaje-animado"></div>

  <script src="../js/avatar-personaje-completo.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (typeof Personaje === 'undefined') {
        console.warn('El script del personaje no se ha cargado correctamente.');
        return;
      }
      var miPersonaje = Personaje.crear('#personaje-animado', { ancho: 320 });
      miPersonaje.expresion('feliz');
      miPersonaje.senalar(20000000);
      miPersonaje.hablar(20000000);
    });
  </script>
  <!-- Contenedor de botones de emociones -->
  <div class="div-img">
    <button type="button" onclick="window.location.href='../mañana/emociones/triste.html'">
      <img src="../img/cara_muy_triste.png" alt="Muy triste">
    </button>

    <button type="button" onclick="window.location.href='../mañana/emociones/enojado.html'">
      <img src="../img/cara_enojada.png" alt="Enojado">
    </button>

    <button type="button" onclick="window.location.href='../mañana/emociones/neutro.html'">
      <img src="../img/cara_neutral.png" alt="Neutral">
    </button>

    <button type="button" onclick="window.location.href='../mañana/emociones/feliz.html'">
      <img src="../img/cara_feliz.png" alt="Feliz">
    </button>

    <button type="button" onclick="window.location.href='../mañana/emociones/superfeliz.html'">
      <img src="../img/cara_superfeliz.png" alt="Muy feliz">
    </button>
  </div>
  <audio id="audio-pagina" src="../audio/sonido.mp4" preload="auto"></audio>

<div class="audio-controles">
  <button type="button" id="btn-pausa">Pausar</button>
  <button type="button" id="btn-reiniciar">Reiniciar</button>
</div>
</body>
</html>
